modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory

#updateJSONURL="https://change.me.example.invalid/updates.json" #optional
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional

logoFile="logo.png"
logoBlur=false
credits="Powered by GeckoLib 4 & Patchouli"
authors="K1chu"

description='''
A steampunk-inspired aerial logistics mod for Minecraft.

Capture entire blocks and storage containers with dyeable Zephyr Haulers and dispatch them across long distances or dimensions using linked Docks and Hubs.

§6Key Features:§r
§7•§r §bAerial Cargo Transport:§r Move chests, barrels, and modded storage without emptying them.
§7•§r §bDynamic Wind & Thermals:§r Ride wind currents and heat updrafts from campfires, magma, or lava.
§7•§r §bModular Upgrades:§r Customize your haulers with Netherite Plating, Waxed Covers, Lightning Rods, Shock Absorbers, and more.
§7•§r §bRedstone Automation:§r Automate launches and fuel tiers for hands-free logistics networks.
§7•§r §b16 Dye Colors & In-Game Guide:§r Full Patchouli guidebook included.
'''

#[[mixins]]
#config="${mod_id}.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
modId="neoforge" #mandatory
type="required" #mandatory
versionRange="[${neo_version},)" #mandatory
ordering="NONE"
side="BOTH"

[[dependencies.zephyr_hauler]]
modId="patchouli"
type="optional"
versionRange="[1.21,)"
ordering="AFTER"
side="BOTH"